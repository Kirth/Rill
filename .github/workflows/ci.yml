name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    # The official image ships rustc and cargo; only rustfmt and clippy are added.
    container: rust:1-slim-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rill
          POSTGRES_PASSWORD: rill
          POSTGRES_DB: rill_test
        options: >-
          --health-cmd "pg_isready -U rill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RILL_TEST_DATABASE_URL: postgres://rill:rill@postgres/rill_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
