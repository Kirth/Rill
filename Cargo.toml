[package]
name = "rill"
version = "0.1.0"
edition = "2021"

[dependencies]
miette = { version = "7", features = ["fancy"] }
regex = "1"
glob = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
rayon = "1"
serde_json = "1"
serde = "1"
toml = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
libc = "0.2"

[dev-dependencies]
